[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "B2B PDF Invoice to Excel extractor with Italian invoice support"
readme = "README.md"
authors = [
    {name = "Yahia", email = "jryahia@github.com"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.scripts]
invoice-extract = "invoice_extractor.cli:_entry_point"

[tool.setuptools.packages.find]
include = ["invoice_extractor*"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
